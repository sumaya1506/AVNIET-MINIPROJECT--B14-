<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — PlaceIQ</title>
  <link rel="stylesheet" href="./css/style.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--bg-base); }
    .reset-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:36px 32px; width:100%; max-width:420px; animation:fadeIn 0.5s ease; }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
    .brand .logo-icon { width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-size:18px; }
    .brand .logo-text { font-family:var(--font-display);font-weight:800;font-size:1.1rem; }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="brand">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">PlaceIQ</div>
    </div>
    <h2 style="font-family:var(--font-display);margin-bottom:6px;">Set New Password</h2>
    <p style="color:var(--text-secondary);font-size:0.88rem;margin-bottom:24px;">Enter a new password for your account.</p>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <input type="password" id="newPassword" class="form-control" placeholder="Min 6 characters"/>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password"/>
    </div>
    <button class="btn btn-primary btn-full" onclick="handleReset()" id="resetBtn" style="margin-top:8px;">Reset Password</button>
    <div id="msg" style="margin-top:14px;font-size:0.85rem;"></div>
  </div>

  <script src="./js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');
    const role   = params.get('role') || 'student';

    if (!token) {
      document.getElementById('msg').innerHTML = '<span style="color:var(--danger);">❌ Invalid reset link.</span>';
    }

    async function handleReset() {
      const pwd1 = document.getElementById('newPassword').value;
      const pwd2 = document.getElementById('confirmPassword').value;
      const msg  = document.getElementById('msg');
      const btn  = document.getElementById('resetBtn');

      if (!pwd1 || pwd1.length < 6) {
        msg.innerHTML = '<span style="color:var(--danger);">Password must be at least 6 characters.</span>';
        return;
      }
      if (pwd1 !== pwd2) {
        msg.innerHTML = '<span style="color:var(--danger);">Passwords do not match.</span>';
        return;
      }

      btn.innerHTML = '<div class="spinner"></div> Resetting…';
      btn.disabled  = true;

      try {
        await API.post('/auth/reset-password', { token, password: pwd1, role });
        msg.innerHTML = '<span style="color:var(--success);">✅ Password reset! Redirecting to login…</span>';
        setTimeout(() => window.location.href = './index.html', 2000);
      } catch (err) {
        msg.innerHTML = `<span style="color:var(--danger);">❌ ${err.message}</span>`;
        btn.innerHTML = 'Reset Password';
        btn.disabled  = false;
      }
    }
  </script>
</body>
</html>
